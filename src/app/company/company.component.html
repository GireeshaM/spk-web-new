<div class="main-container">

  <!-- Floating layer for animation -->
  <div class="animation-layer" #animLayer></div>

  <div class="container mt-4">
    <div class="row">

      <!-- LEFT: Main card -->
      <div class="col-md-8">
        <div class="main-card-wrapper" #mainCard>

          <ng-container *ngIf="selected">
            <!-- FULL BIG CARD -->
            <div
              class="border testimonial-card rounded mt-2 p-4 pb-2 bg-white shadow-sm position-relative border-opacity-0 main-big-card"
            >
              <img
                src="/assets/home/testimonials/vector1.svg"
                class="position-absolute top-0 end-0 m-2 mt-3"
                width="32"
                height="32"
              />
              <img
                src="/assets/home/testimonials/vector2.svg"
                class="position-absolute top-0 end-0 me-5 mt-3"
                width="32"
                height="32"
              />

              <div class="d-flex align-items-center mt-3">
                <img
                  [src]="selected.img"
                  [alt]="selected.name"
                  class="rounded-circle me-3"
                  width="80"
                  height="80"
                />
                <div>
                  <div class="fw-medium mb-1">{{ selected.name }}</div>
                  <div class="text-secondary small">{{ selected.role }}</div>

                  <div class="star-rating mt-1 lh-sm fs-6 d-flex align-items-center gap-1">
                    <ng-container *ngFor="let star of [].constructor(selected.rating)">
                      <i class="fas fa-star text-warning"></i>
                    </ng-container>

                    <ng-container *ngFor="let star of [].constructor(5 - selected.rating)">
                      <i class="far fa-star text-muted"></i>
                    </ng-container>
                  </div>
                </div>
              </div>

              <p class="mt-3 fs-6 lh-lg text-dark">
                {{ selected.text }}
              </p>
            </div>
          </ng-container>
        </div>
      </div>

      <!-- RIGHT: Vertical carousel -->
      <div class="col-md-4 d-flex flex-column align-items-center">

        <!-- Top Arrow -->
        <button
          class="btn btn-light carousel-arrow"
          (click)="scrollUp()"
          [disabled]="carouselIndex === 0"
        >
          ▲
        </button>

        <!-- Carousel window -->
        <div class="carousel-window my-3">
          <div
            class="carousel-inner"
            [style.transform]="'translateY(' + (-carouselIndex * cardHeight) + 'px)'"
          >

            <!-- SIDE SMALL CARDS -->
            <div
              *ngFor="let t of testimonials; let i = index"
              class="side-card border rounded p-3 mb-3 bg-white shadow-sm position-relative"
              #cardElement
              (click)="animateToMain(t, cardElement)"
            >
              <div class="d-flex align-items-center">
                <img
                  [src]="t.img"
                  [alt]="t.name"
                  class="rounded-circle me-2"
                  width="50"
                  height="50"
                />
                <div>
                  <div class="fw-semibold small">{{ t.name }}</div>
                  <div class="text-muted tiny">{{ t.role }}</div>
                </div>
              </div>

              <p class="small mt-2 text-dark two-line">
                {{ t.text }}
              </p>
            </div>

          </div>
        </div>

        <!-- Bottom Arrow -->
        <button
          class="btn btn-light carousel-arrow"
          (click)="scrollDown()"
          [disabled]="carouselIndex >= testimonials.length - visibleCount"
        >
          ▼
        </button>

      </div>
    </div>
  </div>

</div>
