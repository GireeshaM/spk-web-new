<div [ngClass]="{ 'two-per-row': isTwoPerRow }" class="tele align-items-center">
  <!-- Hero Section (unchanged) -->
  <div
    class="container-fluid topSection h-80 p-0"
    [ngStyle]="{ 'background-image': 'url(' + headerBgImg + ')' }"
  >
    <div class="row align-items-center hero-row gx-0">
      <div class="top-content col-6 col-md-6 px-md-5 py-5 px-5 content-down">
        <h1 class="it-header-gradient shadow-320 mb-4">{{ itHeader }}</h1>
        <p class="">{{ itContent }}</p>
      </div>

      <div class="col-md-6 d-flex justify-content-end align-items-center px-0">
        <img
          [src]="industryImg"
          class="img-fluid hero-img"
          alt="Industry Image"
        />
      </div>
    </div>
    <img
      src="assets/Industries/background.png"
      alt="Wave"
      class="wave-overlay"
    />
  </div>

  <div class="container-fluid d-block d-md-none smallScreenSection">
    <img [src]="industryImg" class="img-fluid" alt="Industry Image" />
    <div class="text-center" style="background-color: #0a2250">
      <h1 class="text-white px-5 mb-3 pt-3">{{ itHeader }}</h1>
      <p class="text-content px-5">{{ itContent }}</p>
    </div>
  </div>
  <div class="industryBg">
    <div class="container-fluid p-5 bottomSection mb-5">
      <h1 class="text-center mb-5">
        <strong>{{ itSubHeading }}</strong>
      </h1>
      <div class="row">
        <ng-container *ngFor="let card of cards; let i = index">
          <div
            [ngClass]="{
              'col-6': cards.length === 4 || cards.length === 2,
              'col-4':
                cards.length === 3 || cards.length === 6 || cards.length === 5
            }"
            class="mb-5 d-flex justify-content-center align-items-stretch"
          >
            <div class="industry-card text-center">
              <div class="industry-card-img-wrap">
                <img
                  [src]="card.img"
                  alt="Card Image"
                  class="industry-card-img"
                />
                <span class="industry-card-number">{{ i + 1 }}</span>
              </div>
              <h5 class="industry-card-title mt-4 mb-2">{{ card.title }}</h5>
              <p class="industry-card-desc mb-3">{{ card.description }}</p>
              <a [routerLink]=" card.link " class="industry-card-link">
                Read More <span class="industry-card-link-arrow">&gt;&gt;</span>
              </a>
            </div>
          </div>
        </ng-container>
      </div>
    </div>
  </div>
</div>
