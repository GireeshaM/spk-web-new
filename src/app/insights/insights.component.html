
<div class="container-fluid px-0 py-0 " style="min-height: 605px; height: 605px; margin-top: 40px;">
  <div class="row g-0 align-items-stretch" style="min-height: 605px; height: 605px;">
    <!-- Content: 60% -->
    <div class="col-lg-7 d-flex align-items-center justify-content-center" style="background: linear-gradient(90deg, #4b2067 60%, #1a0033 100%); min-height: 605px; height: 605px;">
      <div class="text-white" style="max-width: 700px;">
        <h1 class="fw-bold mb-4" style="color: white;">Stay Ahead with Expert Insights</h1>
        <p class="fs-5" style="color: white;">
          Explore trends, technologies, and strategies shaping the future of digital transformation.
          Our thought leadership and industry perspectives help you navigate innovation with clarity and confidence.
        </p>
      </div>
    </div>
    <!-- Image: 40% -->
    <div class="col-lg-5 d-none d-lg-block" style="min-height: 605px; height: 605px;">
      <div class="h-100 w-100">
      <img src="/assets/insights/Header.jpg" alt="Expert Insights"
     class="img-fluid h-100 w-100"
     style="object-fit: cover; object-position: top; height: 100%;">
      </div>
    </div>
  </div>
</div>   
<div class="container py-5" style="max-width: 1500px;">
  <h2 class="text-center mb-5 mt-5 fw-bold">Our Insights</h2>
  <div class="row g-5">
    <div class="col-md-4 " *ngFor="let insight of insights">
      <div class="card h-100 border-0 position-relative insight-card">
        <div class="image-wrapper position-relative">
          <img [src]="insight.image" class="card-img-top rounded-0 object-fit-cover" [alt]="insight.title" style="height: 350px; width: 100%;">
          <div class="read-badge position-absolute bottom-0 start-0 d-flex justify-between align-items-center px-3 py-2">
            <span class="text-white fw-semibold">Read</span>
            <span class="arrow-icon ms-auto text-white" style="opacity: 1;">→</span>
          </div>
        </div>
        <div class="card-body">
          <h5 class="card-title fw-semibold" style="font-family: 'Segoe UI', sans-serif;">{{ insight.title }}</h5>
        </div>
      </div>
    </div>
  </div>
</div>
