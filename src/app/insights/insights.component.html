<section class="insights-section container-fluid p-0">
  <div class="row g-0 align-items-stretch">
    <!-- Image (one element only) -->
    <div class="col-lg-5 order-1 order-lg-2">
      <img
        src="/assets/insights/Header.jpg"
        alt="Expert Insights"
        class="img-fluid w-100 h-100 object-fit-cover"
      />
    </div>

    <!-- Content -->
    <div
      class="col-lg-7 order-2 order-lg-1 d-flex align-items-center justify-content-center p-5 insights-content"
    >
      <div class="w-100 px-3 px-lg-5">
        <h1 class="fw-bold mb-4 text-white">Stay Ahead with Expert Insights</h1>
        <h5 class="text-white">
          Explore trends, technologies, and strategies shaping the future of
          digital transformation. Our thought leadership and industry
          perspectives help you navigate innovation with clarity and confidence.
        </h5>
      </div>
    </div>
  </div>
</section>

<div class="container py-5">
  <h2 class="text-center mb-5 mt-5 fw-bold">Our Insights</h2>
  <div class="row g-5">
    <div class="col-md-4" *ngFor="let insight of insights">
      <div class="card h-100 border-0 position-relative insight-card">
        <div
          class="position-relative w-100 our-insights"
          style="height: 350px; overflow: hidden"
        >
          <img
            [src]="insight.image"
            class="card-img-top rounded-0 object-fit-cover"
            [alt]="insight.title"
            style="height: 350px; width: 100%"
          />
          <div
            class="read-badge position-absolute bottom-0 start-0 d-flex align-items-center px-3 py-2"
          >
            <span class="text-white fw-semibold">Read</span>
            <span class="arrow-icon ms-2 text-white">→</span>
          </div>
        </div>
        <div class="card-body">
          <h5
            class="card-title fw-semibold"
            style="font-family: 'Segoe UI', sans-serif"
          >
            {{ insight.title }}
          </h5>
        </div>
      </div>
    </div>
  </div>
</div>
